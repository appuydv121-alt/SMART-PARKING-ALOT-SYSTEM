services:
  - type: web
    name: smart-parking-lot-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SMART_PARKING_ADMIN_PASSWORD
        generateValue: true
      - key: SMART_PARKING_REQUIRE_TURSO
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
