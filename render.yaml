services:
  - type: web
    name: smart-parking-lot-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SMART_PARKING_ADMIN_PASSWORD
        generateValue: true
      - key: SMART_PARKING_DB_PATH
        value: /tmp/smart_parking.db
